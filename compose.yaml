name: flink-masterclass

x-flink-common: &flink-common
  image: flink-masterclass:2.2.1-pyflink-kafka
  restart: unless-stopped
  networks:
    - flink-masterclass
  security_opt:
    - no-new-privileges:true

services:
  kafka:
    image: apache/kafka:4.3.1
    depends_on:
      flink-volume-init:
        condition: service_completed_successfully
    hostname: kafka
    container_name: flink-masterclass-kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 4
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_TRANSACTION_MAX_TIMEOUT_MS: 3600000
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - flink-masterclass
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    hostname: kafka-ui
    container_name: flink-masterclass-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      DYNAMIC_CONFIG_ENABLED: 'false'
      KAFKA_CLUSTERS_0_NAME: flink-masterclass-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      KAFKA_CLUSTERS_0_READONLY: 'false'
    ports:
      - "127.0.0.1:8090:8080"
    networks:
      - flink-masterclass
    security_opt:
      - no-new-privileges:true

  kafka-topic-init:
    image: apache/kafka:4.3.1
    container_name: flink-masterclass-kafka-topic-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic orders --partitions 4 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic paid-orders --partitions 4 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic orders-pyflink --partitions 4 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic paid-order-totals-pyflink --partitions 4 --replication-factor 1
    restart: "no"
    networks:
      - flink-masterclass
    security_opt:
      - no-new-privileges:true

  flink-volume-init:
    image: busybox:1.37
    container_name: flink-masterclass-volume-init
    user: "0:0"
    command:
      - sh
      - -ec
      - |
        mkdir -p /checkpoints /savepoints /kafka-data
        chown -R 9999:0 /checkpoints /savepoints
        chmod -R ug+rwX /checkpoints /savepoints
        chown -R 1000:1000 /kafka-data
        chmod -R u+rwX /kafka-data
    volumes:
      - flink_checkpoints:/checkpoints
      - flink_savepoints:/savepoints
      - kafka_data:/kafka-data
    restart: 'no'

  flink-jobmanager:
    <<: *flink-common
    build:
      context: ./infra/flink
      dockerfile: Dockerfile
    hostname: flink-jobmanager
    container_name: flink-masterclass-jobmanager
    command: jobmanager
    depends_on:
      flink-volume-init:
        condition: service_completed_successfully
      kafka-topic-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        parallelism.default: 4
        jobmanager.memory.process.size: 1200m
        execution.checkpointing.interval: 10s
        execution.checkpointing.mode: EXACTLY_ONCE
        execution.checkpointing.timeout: 60s
        execution.checkpointing.min-pause: 1s
        execution.checkpointing.max-concurrent-checkpoints: 1
        execution.checkpointing.storage: filesystem
        execution.checkpointing.dir: file:///opt/flink/checkpoints
        execution.checkpointing.savepoint-dir: file:///opt/flink/savepoints
        restart-strategy.type: fixed-delay
        restart-strategy.fixed-delay.attempts: 3
        restart-strategy.fixed-delay.delay: 2s
        python.executable: /opt/pyflink-venv/bin/python
        python.client.executable: /opt/pyflink-venv/bin/python
    volumes:
      - flink_checkpoints:/opt/flink/checkpoints
      - flink_savepoints:/opt/flink/savepoints
      - ./python:/opt/flink/python-jobs:ro
      - ./sql:/opt/flink/sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail http://localhost:8081/overview >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - flink-masterclass
    stop_grace_period: 30s

  flink-taskmanager-1:
    <<: *flink-common
    hostname: flink-taskmanager-1
    container_name: flink-masterclass-taskmanager-1
    command: taskmanager
    depends_on:
      flink-jobmanager:
        condition: service_healthy
      flink-volume-init:
        condition: service_completed_successfully
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
        taskmanager.memory.process.size: 1536m
        parallelism.default: 4
        execution.checkpointing.interval: 10s
        execution.checkpointing.mode: EXACTLY_ONCE
        execution.checkpointing.storage: filesystem
        execution.checkpointing.dir: file:///opt/flink/checkpoints
        execution.checkpointing.savepoint-dir: file:///opt/flink/savepoints
        python.executable: /opt/pyflink-venv/bin/python
        python.client.executable: /opt/pyflink-venv/bin/python
    volumes:
      - flink_checkpoints:/opt/flink/checkpoints
      - flink_savepoints:/opt/flink/savepoints
    networks:
      - flink-masterclass
    stop_grace_period: 30s

  flink-taskmanager-2:
    <<: *flink-common
    hostname: flink-taskmanager-2
    container_name: flink-masterclass-taskmanager-2
    command: taskmanager
    depends_on:
      flink-jobmanager:
        condition: service_healthy
      flink-volume-init:
        condition: service_completed_successfully
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
        taskmanager.memory.process.size: 1536m
        parallelism.default: 4
        execution.checkpointing.interval: 10s
        execution.checkpointing.mode: EXACTLY_ONCE
        execution.checkpointing.storage: filesystem
        execution.checkpointing.dir: file:///opt/flink/checkpoints
        execution.checkpointing.savepoint-dir: file:///opt/flink/savepoints
        python.executable: /opt/pyflink-venv/bin/python
        python.client.executable: /opt/pyflink-venv/bin/python
    volumes:
      - flink_checkpoints:/opt/flink/checkpoints
      - flink_savepoints:/opt/flink/savepoints
    networks:
      - flink-masterclass
    stop_grace_period: 30s

  flink-sql-client:
    <<: *flink-common
    profiles:
      - tools
    container_name: flink-masterclass-sql-client
    command:
      - ./bin/sql-client.sh
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        rest.address: flink-jobmanager
        rest.port: 8081
        execution.target: remote
        python.executable: /opt/pyflink-venv/bin/python
        python.client.executable: /opt/pyflink-venv/bin/python
    volumes:
      - ./sql:/opt/flink/sql:ro
    stdin_open: true
    tty: true
    restart: 'no'

networks:
  flink-masterclass:
    name: flink-masterclass-network

volumes:
  flink_checkpoints:
    name: flink-masterclass-checkpoints
  flink_savepoints:
    name: flink-masterclass-savepoints
  kafka_data:
    name: flink-masterclass-kafka-data
